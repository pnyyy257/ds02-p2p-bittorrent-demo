[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ds02-p2p-bittorrent"
version = "1.0.0"
description = "Distributed Systems DS02 - P2P file-sharing simulation"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110,<1", "uvicorn>=0.29,<1", "aiohttp>=3.9,<4", "pydantic>=2.0,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.23,<2", "httpx>=0.26,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
p2psim = ["visual_assets/*.html", "visual_assets/*.css", "visual_assets/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
